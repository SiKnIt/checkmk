name: build-wnx

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S agents\wnx -B build -G "Visual Studio 17 2022"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Upload agent exe
        uses: actions/upload-artifact@v4
        with:
          name: checkmk-agent-exe
          path: |
            build/**/check_mk_agent.exe
            build/**/check_mk_agent*.exe