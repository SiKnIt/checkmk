name: build-wnx

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # run.ps1 requires: choco, perl, make, python (python is already on runner)
      - name: Install prerequisites
        shell: pwsh
        run: |
          choco install -y make strawberryperl
          refreshenv

      - name: Build Windows agent (wnx) only
        shell: pwsh
        run: |
          # 1) Ensure 'where make' returns exactly one entry (you already did this)
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and ($_ -ne 'C:\mingw64\bin') }) -join ';'

          # 2) Force GNU make to use cmd.exe (avoid sh/bash from Git for Windows)
          $env:SHELL = "cmd.exe"

          # 3) Remove Git's Unix tools from PATH so make can't auto-pick sh.exe
          $env:Path = (($env:Path -split ';') | Where-Object {
            $_ -and ($_ -notmatch '\\Git\\usr\\bin$') -and ($_ -notmatch '\\Git\\usr\\bin\\?')
          }) -join ';'

          Write-Host "where make:"; where.exe make
          Write-Host "where sh:";  where.exe sh  2>$null || Write-Host "(no sh.exe in PATH)"
          Write-Host "SHELL=$env:SHELL"

          cd agents\wnx
          .\run.cmd --win-agent --build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: wnx-build-output
          path: |
            agents/wnx/build/**
            artefacts/**