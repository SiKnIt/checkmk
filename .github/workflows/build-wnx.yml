name: build-wnx

on:
  push:
    branches: ["*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # run.ps1 requires: choco, perl, make, python (python is already on runner)
      - name: Install prerequisites
        shell: pwsh
        run: |
          choco install -y make strawberryperl
          refreshenv

      - name: Build Windows agent (wnx) only
        shell: pwsh
        run: |
          cd agents\wnx
          .\run.cmd --win-agent --build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: wnx-build-output
          path: |
            agents/wnx/build/**
            artefacts/**