name: build-wnx

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          cd build
          cmake ..\agents\wnx -G "Visual Studio 17 2022"

      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload agent exe
        uses: actions/upload-artifact@v4
        with:
          name: checkmk-agent-exe
          path: build/**/check_mk_agent*.exe
